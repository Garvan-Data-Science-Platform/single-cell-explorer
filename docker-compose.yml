version: "3.8"

services:
  localstack:
    image: localstack/localstack@sha256:7c6635493185d25165979995fb073fd789c72b6d8b17ef3a70b798d55576732f
    ports:
      - "4566:4566"
    environment:
      - HOSTNAME_EXTERNAL=localstack
      - SERVICES=s3,secretsmanager,stepfunctions,iam,lambda
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - PORT_WEB_UI=${PORT_WEB_UI- }
      - HOST_TMP_FOLDER=${TMPDIR}
      - DEFAULT_REGION=us-west-2
    volumes:
      - localstack:/tmp/localstack
    networks:
      corporanet:
        aliases:
          - localstack.corporanet.local

  explorer:
    image: "${DOCKER_REPO}corpora-explorer"
    build:
      context: .
      dockerfile: hosted/Dockerfile
      cache_from:
        - "${DOCKER_REPO}corpora-explorer:latest"
      args:
        - BUILDKIT_INLINE_CACHE=1
        - IMAGE_TAG
    restart: always
    depends_on:
      - localstack
    ports:
      - "5500:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORPORA_LOCAL_DEV=true
      - AWS_REGION=us-west-2
      - AWS_DEFAULT_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - BOTO_ENDPOINT_URL=http://localstack:4566
      - DEPLOYMENT_STAGE=test
      - RESTART_ON_FAILURE=yes
      - DEV_MODE_COOKIES=1
      - IS_DOCKER_DEV=yes # This skips some unit tests.
      - API_DOMAIN=localhost:5500
      - WEB_DOMAIN=localhost:5500
      - CXG_BUCKET_PATH=corpora-data-dev
      - BYOD_WORKFLOWS_BUCKET_PATH=corpora-data-dev
      - DATA_LOCATOR_DOMAIN=localhost:5500
      - SKIP_ATAC_CACHE=true
    volumes:
      # Mount dirs in a layout suitable for running tests.
      - .:/corpora-data-portal
      # Mount config to override the one baked in the image
      - ./hosted/config.yaml:/config.yaml
      # SecretsManager population relies on oauth json
      - ./oauth/users.json:/oauth/users.json
      - /Users/vupha/Documents/Garvan_Data_Science_Platform/cellxgene_data:/data:ro
    networks:
      corporanet:
        aliases:
          - backend.corporanet.local
networks:
  corporanet:
volumes:
  database:
  localstack:
